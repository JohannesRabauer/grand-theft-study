# CI: runs the node checks on every push and pull request, and publishes the game to GitHub Pages from main.
name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node checks (data, logic, texts, content lint)
        run: node scripts/check-all.mjs

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the game (only what the browser loads)
        run: |
          mkdir _site
          cp index.html main.js sw.js manifest.webmanifest _site/
          cp -r icons _site/
          sed -i "s/schulweg-dev/schulweg-${GITHUB_SHA::7}/" _site/sw.js
          for d in ai camera characters data defense entities grading i18n learning minigames missions particles physics scenes services state tools ui vehicles; do cp -r "$d" _site/; done
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
