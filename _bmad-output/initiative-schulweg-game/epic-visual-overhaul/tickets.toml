# Epic 16: visual overhaul. Build in table order, one story at a time (shared files: GameScene.js, EnvArt.js, World.js, quality.json).
# Every story first loads the project skill `schulweg-pixel-art` (created by entry 1) and follows AD-31 and docs/ART-BIBLE.md.
# Every art story re-runs `node scripts/shots.mjs` and its look metrics (entry 1) and must not make a metric worse outside its own target.

[[entry]]
id = 1
type = "story"
title = "Art bible, pixel-art skill, screenshot set and look metrics"
description = "Writes docs/ART-BIBLE.md (palette ramps per material, top-left light, outline, dithering and anti-banding rules, silhouette rules that forbid tile-aligned rectangles, overlap and depth rules, light and shadow colours, particle and shader catalogue, kid-safe night look, and numeric limits: longest straight surface seam, largest uniform flat area, minimum walkable luminance at night) and turns it into the project skill .claude/skills/schulweg-pixel-art/SKILL.md (when to load, the rules, procedural drawing recipes on top of the EnvArt/HiResArt helpers, the review checklist), and adds scripts/shots.mjs, which captures a fixed shot list without the debug overlay (every district, home, school and dojo interiors, morning/day/evening/night, rain, snow; Medium and Low) into docs/shots/overhaul/<label>/ and computes the look metrics in the page (canvas pixel reads) into metrics.json, then records the before set."
verify = "SKILL.md has valid name and description frontmatter, `node scripts/shots.mjs --label before` run twice gives identical images and metrics, docs/shots/overhaul/before/ holds the set, metrics.json and an index.md naming what looks unfinished in each shot, and a node check validates the metrics schema and limits file."
covers = ["CAP-35"]
after = ["15.4"]
hitl = false
risk = "low"
references = ["../architecture-schulweg-game/architecture-schulweg-game.md#ad-31"]

[[entry]]
id = 2
type = "story"
title = "Lighting and post-effects pipeline (tracer)"
description = "Builds render/LightMap.js (base-resolution light render texture: ambient colour and darkness from the day clock tint, additive pooled light sprites with posterized or dithered radial falloff, multiplied over the world camera and locked to the base pixel grid), render/PostFx.js (WebGL PostFXPipeline with colour grade, vignette and a bloom pass that only picks bright emissive pixels, plus the registry for per-object pipelines in render/pipelines/), ctx.lights (add/move/release handles), data/lighting.json and data/postfx.json, per-tier switches in data/quality.json and the Canvas/Low fallback to the old tint overlay, and wires one street lamp as the first real light."
verify = "At 21:00 a headless High shot shows the dark town with one warm, pixel-stepped lamp pool and a soft vignette, the UI is not darkened or graded, `?q=low` and a forced Canvas renderer show the old tint without errors, a node check covers the light falloff and pool logic, and the bench meets the epic frame-time limit."
covers = ["CAP-35"]
after = [1]
hitl = false
risk = "high"
references = ["../architecture-schulweg-game/architecture-schulweg-game.md#ad-31", "../../../docs/PERFORMANCE.md"]

[[entry]]
