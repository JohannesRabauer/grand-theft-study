description = "Replaces the flat day tint with graded keyframes (cool dawn, neutral day, golden evening, blue night with readable contrast) and adds lights from data through ctx.lights: street lamps that switch on at dusk with a short warm-up flicker, shop and tram-stop signs, vehicle headlights and tail lights that move with traffic and the bike lamp, pooled and culled off screen."
verify = "Evening and night shots of every district show lamps, signs and moving headlights, the night walkable-luminance metric meets the art-bible limit, a node check covers the keyframe blending, and the active light count never exceeds the per-tier cap."
covers = ["CAP-35"]
after = [2]
hitl = false
risk = "medium"

