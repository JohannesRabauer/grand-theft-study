verify = "The seam and flat-area metrics of every district shot meet the art-bible limits, the zoom-sweep gap and shimmer numbers do not get worse, check-envart.mjs gains cases for the noise edge and decal placement, and check-map, check-world and check-collisions pass unchanged."
