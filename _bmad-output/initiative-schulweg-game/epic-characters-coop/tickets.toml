[[entry]]
id = 1
type = "story"
title = "Characters and attribute growth"
description = "Adds data-driven Lena, Mehmet and Jonas with six attributes, start vehicles and perks, character select, and growth hooks via actions."
verify = "Each character moves, aims and tricks according to its attributes, and a matching activity raises the matching attribute."
covers = ["CAP-12"]
after = ["1.1", "1.5"]
hitl = false
risk = "medium"
references = ["../architecture-schulweg-game/architecture-schulweg-game.md#ad-16", "../architecture-schulweg-game/architecture-schulweg-game.md#ad-18"]

