[[entry]]
id = 1
type = "story"
title = "Full HUD modules"
description = "Completes the HUD: clock and season, energy and stamina, Ärger, money, grade average, year, XP, vehicle, tool, ammo and wind."
verify = "Each element shows correct values in one and two player modes."
covers = ["CAP-26"]
after = ["1.4", "1.5"]
hitl = false
risk = "low"
references = ["../architecture-schulweg-game/architecture-schulweg-game.md#ad-27"]

[[entry]]
id = 6
type = "story"
title = "Important text waits for explicit acknowledgement"
description = "Audits instructions, learning explanations, lesson introductions/results, dialogue and major messages so players can read indefinitely before explicitly continuing; relevant timers pause, held input cannot dismiss text, and slower co-op readers are not rushed."
verify = "Important screens remain visible beyond their former timeout, accept explicit keyboard/touch/gamepad confirmation, then restore clocks and gameplay correctly; incidental toasts stay non-blocking."
covers = ["CAP-26", "CAP-7", "CAP-23", "CAP-32"]
after = ["1.4", "4.1"]
hitl = false
risk = "medium"
references = ["../initiative-schulweg-game.md#notes", "../architecture-schulweg-game/architecture-schulweg-game.md#ad-27", "../architecture-schulweg-game/architecture-schulweg-game.md#ad-20"]

[[entry]]
id = 5
type = "story"
title = "Contextual gameplay explanations"
description = "Adds plentiful first-use and situational explanations for bullies and spotting, defense, hiding, tools, skating, vehicle ownership and tricks, with active-device controls, co-op guidance and revisitable help."
verify = "A new player receives relevant localized explanations, can acknowledge and revisit them, and repeat hints do not spam or obscure play."
covers = ["CAP-26", "CAP-20", "CAP-23", "CAP-32"]
after = ["1.4", 6]
hitl = false
risk = "medium"
references = ["../initiative-schulweg-game.md#notes", "../architecture-schulweg-game/architecture-schulweg-game.md#ad-27"]

