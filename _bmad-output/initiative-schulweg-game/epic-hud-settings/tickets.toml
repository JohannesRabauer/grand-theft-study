id = 7
type = "story"
title = "Age-based difficulty independent of character choice"
description = "Uses character ages as per-player difficulty defaults and lets players explicitly choose a difficulty age/level independently of their character, consistently across relevant learning/minigame surfaces while preserving adaptivity, progress and Klasse 3 scope."
