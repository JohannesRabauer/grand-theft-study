# Epic 17: visual polish follow-ups. Build in table order, one story at a time (shared files: EnvArt.js, Interiors, quality.json).
# Every art story first loads the project skill `schulweg-pixel-art` and follows AD-31 and docs/ART-BIBLE.md.
# Every art story re-runs `node scripts/shots.mjs` and its look metrics and must not make a metric worse outside its own target.

[[entry]]
id = 1
type = "story"
title = "Break the long straight seams in the interiors"
description = "Breaks the straight wall-base and wall-cap rows across whole rooms in the school, dojo and home interiors (up to about 470 px against the 96 px limit; school day 471, dojo day 368, home morning 347, school night 262, home night 230, dojo night 179) with seeded jogs, baseboard breaks, door and furniture overlap, wear, shadow and light variation, keeping each room recognisable and its collision, furniture anchors and map data unchanged."
verify = "`node scripts/shots.mjs` shows the longest seam at most 96 px in every interior shot (day, morning and night; Medium and Low), or a named exception in the shots index.md; zoom-sweep gap and shimmer numbers do not get worse; check-all and the seeded smoke test pass."
covers = ["CAP-35"]
after = ["16.16"]
hitl = false
risk = "medium"

