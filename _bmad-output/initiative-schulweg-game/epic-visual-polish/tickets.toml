description = "Adds a cheap pass or dither for Low (no WebGL pipeline) so large dark or one-tone ground and water no longer exceed 4096 px2 in oldtown-rain-night (7623), market-evening (6938), riverside-night (6063) and riverside-evening (5119): for example a baked, dithered tone variation or a pre-lit ground layer, and re-checks the oldtown Medium value. Medium and High output stay pixel-identical."
