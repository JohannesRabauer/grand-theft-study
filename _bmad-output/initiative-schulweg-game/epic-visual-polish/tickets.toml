[[entry]]
id = 5
type = "story"
title = "Confirm the frame-time limit on a quiet machine"
description = "The +25 percent relative frame-time limit was never reliably shown on the shared dev machine (+9 percent against interleaved medians, +30 to +45 percent against best runs; the absolute limit p95 <= 2.1 ms was met). Repeats the headless bench with `scripts/bench-cdp.mjs` on a quiet machine against the 16.1 baseline (8330e10), records the numbers in docs/PERFORMANCE.md, and tunes caps and per-tier switches in data/quality.json if the limit does not hold."
verify = "docs/PERFORMANCE.md holds a table with interleaved medians and best runs on a quiet machine showing Medium and High at most 16.7 ms p95 and at most +25 percent over the baseline, or the tuning that makes it hold, and check-all and the seeded smoke test pass."
covers = ["CAP-35", "CAP-33"]
after = [4]
hitl = false
risk = "low"

