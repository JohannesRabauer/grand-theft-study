[[entry]]
id = 5
type = "story"
title = "Players array and per-player intents"
description = "Replaces the singular player with ctx.players, adds a compatibility ctx.player, per-player intent snapshots and the P1/P2 bindings in data/input.json."
verify = "Single-player plays as before; a test creates two intents driven by different keys and a gamepad and each moves only its player."
