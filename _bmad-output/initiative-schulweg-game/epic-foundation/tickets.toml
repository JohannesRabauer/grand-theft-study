[[entry]]
id = 1
type = "story"
title = "Game state store and save slots"
description = "Adds ctx.state with the versioned schema, actions-only mutation, three save slots, migration chain, corrupt-slot backup and autosave hooks on phase:ended."
verify = "A scripted run dispatches actions, saves, reloads and finds the same state; a corrupted slot is backed up and reported without a crash."
covers = ["CAP-27"]
after = []
hitl = false
risk = "medium"
references = ["../architecture-schulweg-game/architecture-schulweg-game.md#ad-16"]

[[entry]]
id = 2
type = "story"
title = "Save slot menu and continue flow"
description = "Adds the menu screens to start a new game, continue or delete one of three slots, with slot summaries via ctx.t."
verify = "From the menu a new game in slot 2 can be created, left, and continued after a page reload."
covers = ["CAP-27", "CAP-32"]
after = [1]
hitl = false
risk = "low"
references = ["../architecture-schulweg-game/architecture-schulweg-game.md#ad-16"]

[[entry]]
id = 3
type = "story"
title = "Day clock and phase machine"
description = "Adds DayClock with data/day.json: game time, five phases, season and weather schedule, phase events, advance(reason) and the HUD clock with season icon."
verify = "A full day steps through all phases in the configured real time, emits phase events, and the clock and season show in the HUD."
covers = ["CAP-2"]
after = [1]
hitl = false
risk = "low"
references = ["../architecture-schulweg-game/architecture-schulweg-game.md#ad-17"]

