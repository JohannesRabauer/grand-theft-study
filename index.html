<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Schulweg</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; touch-action: none; user-select: none; -webkit-user-select: none; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; touch-action: none; }
    #rotate-hint { position: fixed; inset: 0; z-index: 10; background: #10131c; color: #fff; font: 20px/1.4 monospace; text-align: center; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
    #rotate-hint[hidden] { display: none; }
    #rotate-hint .rotate-icon { width: 48px; height: 80px; border: 4px solid #fff; border-radius: 8px; animation: rotate-phone 2.4s ease-in-out infinite; }
    @keyframes rotate-phone { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
</head>
<body>
  <script type="module" src="main.js"></script>
</body>
</html>
